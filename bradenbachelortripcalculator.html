<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:14px/1.5 "Archivo",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:#E9EBE6;color:#111C22}
  img{max-width:100%}
  [hidden]{display:none!important}

  /* ---- lock screen ---- */
  #gate{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .lock{width:100%;max-width:400px;background:#fff;border:1px solid #D3D7D0;border-radius:4px;
        box-shadow:0 1px 2px rgba(17,28,34,.06),0 12px 32px -20px rgba(17,28,34,.4);padding:30px 26px 26px}
  .lk{font:600 10.5px/1 "Archivo",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#C24A17;margin-bottom:12px}
  .lock h1{font:800 27px/1.05 "Archivo",sans-serif;letter-spacing:-.025em;margin:0 0 9px}
  .lock p.sub{font:400 15px/1.45 "Newsreader",Georgia,serif;color:#44555F;margin:0 0 20px}
  .lock label{display:block;font:600 10.5px/1 "Archivo",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#77878F;margin-bottom:7px}
  .pwrow{display:flex;border:1px solid #BFC5BD;border-radius:3px;background:#F3F4F0;overflow:hidden}
  .pwrow input{flex:1;min-width:0;border:0;background:transparent;padding:11px 12px;
    font:500 15px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:#111C22}
  .pwrow input:focus{outline:none}
  .pwrow:focus-within{border-color:#1B5F7A;box-shadow:0 0 0 2px #D9E7ED}
  .peek{border:0;border-left:1px solid #BFC5BD;background:transparent;color:#5C6B7A;cursor:pointer;
    font:600 10.5px/1 "Archivo",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:0 12px}
  .peek:hover{color:#1B5F7A}
  button.go{width:100%;margin-top:14px;border:0;border-radius:3px;background:#111C22;color:#E9EBE6;
    font:600 14px/1 "Archivo",sans-serif;padding:13px;cursor:pointer;letter-spacing:.01em}
  button.go:hover{background:#1B5F7A}
  button.go:disabled{opacity:.55;cursor:default}
  button:focus-visible,input:focus-visible{outline:2px solid #C24A17;outline-offset:2px}
  .err{margin-top:13px;font:500 12.5px/1.4 "IBM Plex Mono",monospace;color:#C24A17;min-height:17px}
  .foot{margin-top:20px;padding-top:15px;border-top:1px solid #D3D7D0;
        font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:#77878F}
  @keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
  .shake{animation:shake .4s}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
  @media (prefers-color-scheme:dark){
    body{background:#0C1418;color:#E4ECEF}
    .lock{background:#141F25;border-color:#26353D}
    .lock p.sub{color:#A3B4BC}
    .lock label,.foot{color:#71858E}
    .pwrow{background:#1B282F;border-color:#33454E}
    .pwrow input{color:#E4ECEF}
    .pwrow:focus-within{border-color:#5AAAC6;box-shadow:0 0 0 2px #17323E}
    .peek{border-left-color:#33454E;color:#A3B4BC}
    button.go{background:#5AAAC6;color:#0C1418}
    button.go:hover{background:#7FC2D8}
    .err{color:#EE7B45}
    .lk{color:#EE7B45}
    .foot{border-top-color:#26353D}
  }
</style>
</head>

  var D = JSON.parse(document.getElementById("payload").textContent);
  var form = document.getElementById("lockForm"),
      pw = document.getElementById("pw"),
      go = document.getElementById("go"),
      err = document.getElementById("err"),
      gate = document.getElementById("gate"),
      app = document.getElementById("app");

  document.getElementById("peek").addEventListener("click", function(){
    var showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    this.textContent = showing ? "Show" : "Hide";
    pw.focus();
  });

  function b(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }

  async function unlock(pass){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    var aes = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b(D.salt), iterations:D.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(D.iv)}, aes, b(D.ct));
    return new TextDecoder().decode(plain);
  }

  function mount(html){
    app.innerHTML = html;
    // innerHTML does not execute scripts - re-create them so they run.
    var scripts = app.querySelectorAll("script");
    for (var i = 0; i < scripts.length; i++){
      var old = scripts[i], s = document.createElement("script");
      for (var j = 0; j < old.attributes.length; j++){
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.text = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
    gate.hidden = true;
    app.hidden = false;
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    if (!crypto || !crypto.subtle){
      err.textContent = "This browser can't decrypt the page. Try Safari or Chrome over https.";
      return;
    }
    var v = pw.value;
    if (!v) return;
    go.disabled = true; go.textContent = "Unlocking\u2026"; err.textContent = "";
    try {
      var html = await unlock(v);
      try { sessionStorage.setItem("breckKey", v); } catch(_){}
      mount(html);
    } catch(_) {
      go.disabled = false; go.textContent = "Unlock";
      err.textContent = "Wrong password.";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      pw.select();
    }
  });

  // Stay unlocked while the tab is open.
  (async function(){
    var saved = null;
    try { saved = sessionStorage.getItem("breckKey"); } catch(_){}
    if (!saved) { pw.focus(); return; }
    try { mount(await unlock(saved)); }
    catch(_){ try { sessionStorage.removeItem("breckKey"); } catch(__){} pw.focus(); }
  })();
})();
</script>
</body>
</html>
