<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Galleries | mr.manager</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --mono:'Share Tech Mono',monospace; --display:'Bebas Neue',sans-serif; --sans:'DM Sans',sans-serif; --line:#1e1e1e; --line2:#2c2c2c; --dim:#666; --mid:#aaa; --ok:#7fc29b; --warn:#e0b25a; --bad:#e06a5a; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:#050505; color:#eee; }
  body { font-family:var(--sans); -webkit-font-smoothing:antialiased; font-size:14px; }
  a { color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:28px clamp(16px,4vw,40px) 120px; }
  .nav { display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#777; margin-bottom:34px; gap:12px; }
  .nav a { text-decoration:none; color:#888; }
  h1 { font-family:var(--display); font-weight:normal; font-size:clamp(44px,7vw,72px); line-height:.9; margin:0 0 6px; letter-spacing:.02em; }
  h2 { font-family:var(--mono); font-weight:normal; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#888; border-bottom:1px solid var(--line); padding-bottom:10px; margin:36px 0 14px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .sub { color:#888; font-weight:300; margin:0 0 20px; }
  .btn { background:none; border:1px solid #444; color:#ddd; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; padding:10px 13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#fff; color:#fff; }
  .btn.solid { background:#eee; color:#000; border-color:#eee; }
  .btn.red { border-color:#5a2a24; color:var(--bad); }
  .btn.sm { padding:7px 9px; font-size:9px; }
  .btn[disabled] { opacity:.4; cursor:default; }
  .card { border:1px solid var(--line); padding:16px; margin-bottom:10px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; }
  .card .t { font-size:16px; } .card .m { font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:#777; text-transform:uppercase; margin-top:6px; line-height:1.8; }
  .tag { display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; padding:3px 6px; border:1px solid var(--line2); margin-right:6px; }
  .tag.live { color:var(--ok); border-color:#2d4a39; } .tag.draft { color:var(--warn); border-color:#4a3d22; } .tag.exp { color:var(--bad); border-color:#5a2a24; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px 14px; }
  .f label { display:block; font-family:var(--mono); font-size:9px; letter-spacing:.18em; color:#777; text-transform:uppercase; margin-bottom:6px; }
  .f input, .f select, .f textarea { width:100%; background:#101010; border:1px solid #242424; color:#fff; font-family:var(--mono); font-size:13px; padding:10px 11px; outline:none; }
  .f input:focus { border-color:#555; }
  .f small { color:#666; font-size:11px; display:block; margin-top:5px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .drop { border:1px dashed #333; padding:28px 18px; text-align:center; color:#888; font-weight:300; line-height:1.6; }
  .drop.over { border-color:#aaa; color:#ddd; background:#0c0c0c; }
  .bar { height:3px; background:#151515; margin:12px 0; } .bar i { display:block; height:100%; width:0; background:#ddd; transition:width .2s; }
  .ulist { font-family:var(--mono); font-size:11px; color:#999; max-height:260px; overflow:auto; }
  .ulist div { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #121212; }
  .ulist .ok { color:var(--ok); } .ulist .err { color:var(--bad); } .ulist .skip { color:#666; }
  .report { border:1px solid #4a3d22; background:#0d0b06; padding:14px; margin:12px 0; }
  .report h3 { font-family:var(--mono); font-weight:normal; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--warn); margin:0 0 10px; }
  .rfile { padding:8px 0; border-bottom:1px solid #1a160d; font-size:13px; }
  .rfile b { font-weight:400; color:#ddd; font-family:var(--mono); font-size:12px; }
  .rfile .m { font-size:12px; line-height:1.6; margin-top:3px; }
  .lv-bad { color:var(--bad); } .lv-warn { color:var(--warn); } .lv-info { color:#777; }
  .ph .w { position:absolute; top:6px; right:6px; font-family:var(--mono); font-size:10px; background:rgba(0,0,0,.75); color:var(--warn); padding:2px 6px; cursor:help; }
  .ph .e { position:absolute; bottom:34px; left:6px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; background:rgba(0,0,0,.7); color:#ddd; padding:3px 6px; }
  .er { display:grid; grid-template-columns:64px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #141414; }
  .er img { width:64px; height:64px; object-fit:cover; background:#111; }
  .er .d { font-size:13px; line-height:1.55; color:#ccc; } .er .d small { color:#777; display:block; font-family:var(--mono); font-size:10px; letter-spacing:.08em; }
  .er .a { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .ph { position:relative; background:#111; border:1px solid var(--line); }
  .ph img { display:block; width:100%; aspect-ratio:1; object-fit:cover; }
  .ph .cap { display:flex; justify-content:space-between; align-items:center; gap:4px; padding:6px; font-family:var(--mono); font-size:10px; color:#888; }
  .ph .u { position:absolute; top:6px; left:6px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; background:rgba(0,0,0,.7); color:var(--ok); padding:3px 6px; }
  .ph .cap button { background:none; border:0; color:#777; cursor:pointer; font-family:var(--mono); font-size:10px; padding:2px 4px; }
  .ph .cap button:hover { color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid #141414; font-weight:300; }
  th { font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:#666; text-transform:uppercase; font-weight:normal; }
  .linkbox { font-family:var(--mono); font-size:12px; background:#0d0d0d; border:1px solid #222; padding:12px; word-break:break-all; color:#ddd; }
  .note { color:#888; font-weight:300; font-size:13px; line-height:1.6; }
  .toast { position:fixed; right:16px; bottom:16px; background:#111; border:1px solid #333; padding:12px 16px; font-size:13px; transform:translateY(200%); visibility:hidden; transition:transform .2s; z-index:9; }
  .toast.on { transform:none; visibility:visible; }
  .spin { width:14px; height:14px; border:2px solid #333; border-top-color:#ccc; border-radius:50%; animation:s .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes s { to { transform:rotate(360deg); } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a href="/mr.manager">← mr.manager</a><span id="who"></span></nav>
  <div id="app"><span class="spin"></span></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var SUPA_URL = 'https://zbcdeglxwrappriwpxwt.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiY2RlZ2x4d3JhcHByaXdweHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5MzcyODUsImV4cCI6MjA4OTUxMzI4NX0.IMGxd2IIRvVWgA441aLFtH2VujrZgVRehv2Hb2qNEus';
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  var BUCKET = 'client-galleries';
  var SITE = 'https://stuartsingleton.com';
  var PREVIEW_PX = 1600, THUMB_PX = 720, CONCURRENCY = 2;
  var WATERMARK = 'STUART SINGLETON · PROOF';
  var CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTVWXYZ23456789';

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
  var money = function (c) { return '$' + ((c || 0) / 100).toFixed((c || 0) % 100 ? 2 : 0); };
  var unwrap = function (r) { if (r.error) throw r.error; return r.data; };
  var tt;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('on'); }, 3500); }
  function fmtDate(d) { if (!d) return '—'; var x = new Date(d.length === 10 ? d + 'T12:00:00' : d); return x.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
  function previewFor(g) { return location.origin + '/g/' + g.slug + '?code=' + encodeURIComponent(g.access_code) + '&preview=1'; }
  function linkFor(g) { return SITE + '/g/' + g.slug + '?code=' + encodeURIComponent(g.access_code); }
  function newCode() { var b = crypto.getRandomValues(new Uint8Array(8)); return Array.from(b, function (x) { return CODE_ALPHABET[x % CODE_ALPHABET.length]; }).join(''); }
  function slugify(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50); }
  function copy(text) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied'); }, function () { prompt('Copy this:', text); }); }

  // ── AUTH (same Supabase session as /mr.manager) ──
  function boot() {
    sb.auth.getSession().then(function (r) {
      var s = r.data.session;
      if (!s) return loginView();
      return sb.rpc('is_site_admin').then(function (x) {
        if (!x.data) { app.innerHTML = '<p class="note">This account isn’t an admin.</p>'; return; }
        $('who').innerHTML = esc(s.user.email) + ' · <a href="#" id="lo">Sign out</a>';
        $('lo').onclick = function (e) { e.preventDefault(); sb.auth.signOut().then(function () { location.reload(); }); };
        route();
      });
    });
  }
  function loginView() {
    app.innerHTML = '<h1>CLIENT GALLERIES</h1><p class="sub">Sign in with your mr.manager login.</p>' +
      '<form id="lf" class="form" style="max-width:420px;grid-template-columns:1fr"><div class="f"><label>Email</label><input id="le" type="email" autocomplete="username" required></div>' +
      '<div class="f"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div><div><button class="btn solid">Sign in</button> <span id="lerr" style="color:var(--bad)"></span></div></form>';
    $('lf').onsubmit = function (e) {
      e.preventDefault();
      sb.auth.signInWithPassword({ email:$('le').value, password:$('lp').value }).then(function (r) { if (r.error) $('lerr').textContent = r.error.message; else boot(); });
    };
  }

  // ── ROUTER (#new, #g=<id>, default list) ──
  window.addEventListener('hashchange', route);
  function route() {
    var h = location.hash;
    if (h === '#new') return editView(null);
    var m = /^#g=([0-9a-f-]{36})$/.exec(h);
    if (m) return detailView(m[1]);
    listView();
  }

  // ── LIST ──
  function listView() {
    app.innerHTML = '<span class="spin"></span>';
    Promise.all([
      sb.from('client_galleries').select('*').order('created_at', { ascending:false }).then(unwrap),
      sb.from('client_gallery_photos').select('gallery_id').then(unwrap),
      sb.from('client_gallery_unlocks').select('gallery_id').then(unwrap),
      sb.from('client_gallery_orders').select('gallery_id,amount_total,status').eq('status', 'paid').then(unwrap),
      sb.from('print_orders').select('gallery_id,amount_total,status').not('gallery_id', 'is', null).then(unwrap)
    ]).then(function (r) {
      var gs = r[0], cnt = function (rows, id) { return rows.filter(function (x) { return x.gallery_id === id; }); };
      var html = '<h1>CLIENT GALLERIES</h1><p class="sub">Private delivery pages at stuartsingleton.com/g/&lt;name&gt;. Never public, never in the shop or feeds.</p>' +
        '<div class="row" style="margin:0 0 18px"><a class="btn solid" href="#new" style="text-decoration:none">New client gallery</a></div>';
      if (!gs.length) html += '<p class="note">No galleries yet.</p>';
      gs.forEach(function (g) {
        var ph = cnt(r[1], g.id).length, un = cnt(r[2], g.id).length;
        var extras = cnt(r[3], g.id).reduce(function (n, o) { return n + o.amount_total; }, 0);
        var prints = cnt(r[4], g.id).filter(function (o) { return ['paid', 'submitted', 'shipped'].indexOf(o.status) > -1; });
        var exp = g.expires_at && new Date(g.expires_at) < new Date();
        html += '<div class="card"><div><div class="t">' + esc(g.title) + ' · ' + esc(g.client_name || '') + '</div><div class="m">' +
          '<span class="tag ' + (exp ? 'exp">Expired' : g.is_active ? 'live">Live' : 'draft">Draft') + '</span>' +
          esc(g.slug) + ' · ' + ph + ' photos · ' + un + ' unlocked · ' + (g.included_unlocks + g.bonus_unlocks) + ' allowed' +
          (extras ? ' · extras ' + money(extras) : '') + (prints.length ? ' · ' + prints.length + ' print orders' : '') +
          ' · until ' + fmtDate(g.expires_at) + '</div></div>' +
          '<div class="row" style="margin:0"><button class="btn sm" data-copy="' + esc(linkFor(g)) + '">Copy link</button><a class="btn sm" style="text-decoration:none" href="#g=' + g.id + '">Open</a></div></div>';
      });
      app.innerHTML = html;
      app.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { copy(b.dataset.copy); }; });
    }).catch(function (e) { app.innerHTML = '<p style="color:var(--bad)">' + esc(e.message || e) + '</p>'; });
  }

  // ── CREATE / EDIT ──
  function editView(g) {
    var isNew = !g;
    var d = g || { title:'Photo Shoot', client_name:'', client_email:'', shoot_date:'', included_unlocks:18, bonus_unlocks:0,
      extra_unlock_cents:2000, bundle_size:5, bundle_cents:7500, access_code:newCode(), is_active:false, note:'',
      expires_at:new Date(Date.now() + 90 * 86400000).toISOString() };
    app.innerHTML = '<h1>' + (isNew ? 'NEW GALLERY' : 'EDIT GALLERY') + '</h1><p class="sub">' + (isNew ? 'Create it as a draft, upload the photos, then publish and send the link.' : esc(d.slug)) + '</p>' +
      '<form id="ef"><div class="form">' +
      fld('client_name', 'Client name', d.client_name, 'text', 'First name shows on the page') +
      fld('client_email', 'Client email', d.client_email, 'email', 'For your records') +
      fld('title', 'Page title', d.title, 'text', 'e.g. Nashville Photo Shoot') +
      fld('shoot_date', 'Shoot date', d.shoot_date || '', 'date') +
      fld('slug', 'Link name', d.slug || '', 'text', isNew ? 'stuartsingleton.com/g/<this>' : 'Changing it breaks links already sent') +
      fld('access_code', 'Access code', d.access_code, 'text', 'Part of the link. 6+ characters') +
      fld('included_unlocks', 'Included photos', d.included_unlocks, 'number', 'From the contract') +
      fld('bonus_unlocks', 'Bonus photos (free)', d.bonus_unlocks, 'number', 'Extra on you') +
      fld('extra_price', 'Extra photo price ($)', d.extra_unlock_cents / 100, 'number') +
      fld('bundle_size', 'Bundle size', d.bundle_size, 'number') +
      fld('bundle_price', 'Bundle price ($)', d.bundle_cents / 100, 'number') +
      fld('expires_at', 'Available until', d.expires_at ? d.expires_at.slice(0, 10) : '', 'date', 'Blank = never closes') +
      fld('free_edits', 'Free edit requests', d.free_edits != null ? d.free_edits : 5, 'number', 'Small edits on unlocked photos') +
      fld('edit_price', 'Price per extra edit ($)', (d.edit_price_cents != null ? d.edit_price_cents : 500) / 100, 'number', '0 = all edits free') +
      '</div><div class="f" style="margin-top:12px"><label>Private note</label><textarea id="f-note" rows="2">' + esc(d.note || '') + '</textarea></div>' +
      '<div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-active"' + (d.is_active ? ' checked' : '') + '> Live (client can open the link)</label></div>' +
      '<div class="row"><button class="btn solid" id="f-save">' + (isNew ? 'Create draft' : 'Save') + '</button><a class="btn" style="text-decoration:none" href="' + (isNew ? '#' : '#g=' + d.id) + '">Cancel</a><span id="f-err" style="color:var(--bad)"></span></div></form>';
    if (isNew) {
      var auto = true, sl = $('f-slug');
      sl.oninput = function () { auto = false; };
      // "Diane" + "Diane's Nashville Photoshoot" -> "diane-nashville": drop possessives, the repeated name and shoot words.
      var upd = function () {
        if (!auto) return;
        var first = slugify($('f-client_name').value.split(' ')[0] || '');
        var words = slugify($('f-title').value.replace(/['\u2019]s\b/gi, '')).split('-').filter(function (w) {
          return w && w !== first && ['photo', 'photos', 'shoot', 'photoshoot', 'session', 'the', 'a'].indexOf(w) < 0;
        });
        sl.value = [first].concat(words).filter(Boolean).join('-').slice(0, 50);
      };
      $('f-client_name').oninput = upd; $('f-title').oninput = upd; upd();
    }
    $('ef').onsubmit = function (e) {
      e.preventDefault();
      var v = function (k) { return $('f-' + k).value.trim(); };
      var row = {
        client_name:v('client_name') || null, client_email:v('client_email') || null, title:v('title') || 'Photo Shoot',
        shoot_date:v('shoot_date') || null, slug:slugify(v('slug')), access_code:v('access_code').toUpperCase(),
        included_unlocks:parseInt(v('included_unlocks'), 10) || 0, bonus_unlocks:parseInt(v('bonus_unlocks'), 10) || 0,
        extra_unlock_cents:Math.round(parseFloat(v('extra_price') || '0') * 100), bundle_size:parseInt(v('bundle_size'), 10) || 5,
        bundle_cents:Math.round(parseFloat(v('bundle_price') || '0') * 100),
        free_edits:parseInt(v('free_edits'), 10) || 0, edit_price_cents:Math.round(parseFloat(v('edit_price') || '0') * 100),
        expires_at:v('expires_at') ? new Date(v('expires_at') + 'T23:59:59').toISOString() : null,
        note:$('f-note').value.trim() || null, is_active:$('f-active').checked
      };
      if (!/^[a-z0-9][a-z0-9-]{2,60}$/.test(row.slug)) { $('f-err').textContent = 'Link name: 3+ letters, numbers or dashes.'; return; }
      if (row.access_code.length < 6) { $('f-err').textContent = 'Access code needs 6+ characters.'; return; }
      $('f-save').disabled = true;
      var q = isNew ? sb.from('client_galleries').insert(row).select().single() : sb.from('client_galleries').update(row).eq('id', d.id).select().single();
      q.then(function (r) {
        if (r.error) { $('f-save').disabled = false; $('f-err').textContent = /duplicate|unique/i.test(r.error.message) ? 'That link name is taken.' : r.error.message; return; }
        location.hash = '#g=' + r.data.id;
      });
    };
  }
  function fld(k, label, val, type, help) {
    return '<div class="f"><label for="f-' + k + '">' + label + '</label><input id="f-' + k + '" type="' + (type || 'text') + '"' + (type === 'number' ? ' step="any" min="0"' : '') + ' value="' + esc(val) + '">' + (help ? '<small>' + esc(help) + '</small>' : '') + '</div>';
  }

  // ── DETAIL ──
  var D = { g:null, photos:[], unl:{} };
  function detailView(id) {
    app.innerHTML = '<span class="spin"></span>';
    Promise.all([
      sb.from('client_galleries').select('*').eq('id', id).single().then(unwrap),
      sb.from('client_gallery_photos').select('*').eq('gallery_id', id).order('position').order('created_at').then(unwrap),
      sb.from('client_gallery_unlocks').select('photo_id,source,created_at').eq('gallery_id', id).then(unwrap),
      sb.from('client_gallery_orders').select('*').eq('gallery_id', id).order('created_at', { ascending:false }).then(unwrap),
      sb.from('print_orders').select('id,status,amount_total,items,shipping_name,created_at,prodigi_order_id,tracking_url').eq('gallery_id', id).order('created_at', { ascending:false }).then(unwrap),
      sb.from('client_gallery_edit_requests').select('*').eq('gallery_id', id).order('created_at', { ascending:false }).then(unwrap)
    ]).then(function (r) {
      var g = r[0]; D.g = g; D.photos = r[1]; D.unl = {}; r[2].forEach(function (u) { D.unl[u.photo_id] = u; });
      var orders = r[3], prints = r[4]; D.edits = r[5];
      var openEdits = D.edits.filter(function (e) { return e.status === 'open'; }).length;
      var freeUsed = D.edits.filter(function (e) { return !e.paid && e.status !== 'cancelled'; }).length;
      var paidCredits = orders.filter(function (o) { return o.status === 'paid'; }).reduce(function (n, o) { return n + o.credits; }, 0);
      var used = r[2].filter(function (u) { return u.source === 'allowance'; }).length;
      var total = g.included_unlocks + g.bonus_unlocks + paidCredits;

  }

  // Client-facing numbers: originals 1..N in order; an edit shares its original's number.
  function photoNums() {

    return nums;
  }

  // ── EDIT REQUESTS ──
  var OPT_LABEL = { bw:'Black and white', brighter:'Brighter', darker:'Darker', warmer:'Warmer', cooler:'Cooler', crop:'Crop', remove:'Remove something', other:'Other' };
  function renderEdits() {

        var st = e.status === 'open' ? '<span class="lv-warn">Open</span>' : e.status === 'done' ? '<span style="color:var(--ok)">Done ' + fmtDate(e.done_at) + '</span>' : '<span class="lv-info">Awaiting her payment</span>';
        return '<div class="er"><img src="' + esc(urls[j] || '') + '" alt=""><div class="d">Photo ' + String(n).padStart(2, '0') + ' · ' + esc(opts || 'See note') +
          (e.note ? '<br>\u201c' + esc(e.note) + '\u201d' : '') + '<small>' + fmtDate(e.created_at) + ' · ' + (e.paid ? 'paid' : 'free') + ' · ' + st + '</small><div id="es-' + e.id + '" class="lv-info" style="font-size:12px"></div></div>' +
          '<div class="a">' + (e.status === 'open' ? '<input type="file" accept="image/jpeg,image/png,image/webp" hidden id="ef-' + e.id + '"><button class="btn sm solid" data-eup="' + e.id + '">Upload edited version</button><button class="btn sm" data-ecan="' + e.id + '">Cancel</button>' : '') + '</div></div>';

      }; });
    });
  }
  function deliverEdit(e, file) {

  }
  function drawU() {
    var done = U.items.filter(function (x) { return x.status !== 'queued' && x.status !== 'working' && x.status !== 'checking'; }).length;
    $('ubar').style.width = (U.items.length ? done / U.items.length * 100 : 0) + '%';
    $('ulist').innerHTML = U.items.map(function (x) {
      var cls = x.status === 'done' ? 'ok' : x.status === 'error' ? 'err' : x.status === 'skip' ? 'skip' : '';

      return '<div><span>' + esc(x.file.name) + '</span><span class="' + cls + '">' + esc(x.msg) + (x.status === 'error' ? ' <a href="#" data-retry="' + U.items.indexOf(x) + '">retry</a>' : '') + '</span></div>';
    }).join('');

  }
  function runU() {
    U.running = true;
    var next = function () {

      if (!it) return Promise.resolve();

      return Promise.resolve().then(function () { return uploadOne(it); }).then(function () { it.status = it.status === 'skip' ? 'skip' : 'done'; if (it.status === 'done') it.msg = 'done'; },
        function (e) { it.status = 'error'; it.msg = String((e && (e.message || e.error)) || e).slice(0, 80); console.error(e); })
        .then(function () { drawU(); return next(); });
    };

    Promise.all(workers).then(function () {
      U.running = false;

      toast(ok + ' uploaded' + (bad ? ', ' + bad + ' failed (retry them)' : ''));
      if (!bad && !U.items.some(function (x) { return x.status === 'checking'; })) {
        U.items = [];
        // Keep the whole gallery in file-name order, not just this batch.
        sb.rpc('client_gallery_sort_by_filename', { p_gallery:D.g.id }).then(function () { detailView(D.g.id); });
      }
    });
  }
  function retry(fn, label) {
    var a = 0;
    return (function go() {
      return fn().catch(function (e) { if (/duplicate|unique/i.test(String(e && e.message)) || ++a >= 3) throw new Error(label + ': ' + (e.message || e)); return new Promise(function (r) { setTimeout(r, 900 * Math.pow(2, a)); }).then(go); });

  // Reads the file once; the same bytes are hashed and uploaded, so what's stored is exactly what was hashed.

    var x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, W, H);
    if (mark) {
      var fs = Math.max(11, Math.round(Math.max(W, H) * 0.017));
      x.font = fs + "px 'Share Tech Mono', monospace";
      x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      if ('letterSpacing' in x) x.letterSpacing = Math.round(fs * 0.28) + 'px';
      x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = Math.round(fs * 0.5);
      x.fillStyle = 'rgba(255,255,255,.72)';

  }
  function uploadOne(it) {
    var g = D.g, f = it.file, id = it.id || (it.id = crypto.randomUUID()), ext = (/\.([a-z0-9]{2,5})$/i.exec(f.name) || [, 'jpg'])[1].toLowerCase(), dec;
    var paths = { master:g.id + '/master/' + id + '.' + ext, preview:g.id + '/preview/' + id + '.jpg', thumb:g.id + '/thumb/' + id + '.jpg', clean:g.id + '/clean/' + id + '.jpg' };
    var put = function (path, body, type) { return retry(function () { return sb.storage.from(BUCKET).upload(path, body, { contentType:type, upsert:true, cacheControl:'31536000' }).then(unwrap); }, 'upload'); };
    var master;
    return readHash(f).then(function (r) {
      var hash = r.hash; it.hash = hash; master = new Blob([r.buf], { type:f.type || 'image/jpeg' });
      if (D.photos.some(function (p) { return p.sha256 === hash; }) || U.items.some(function (x) { return x !== it && x.hash === hash && x.status !== 'error' && U.items.indexOf(x) < U.items.indexOf(it); })) { it.status = 'skip'; it.msg = 'already in gallery'; throw { skip:true }; }

      return retry(function () {
        return sb.from('client_gallery_photos').insert({ id:id, gallery_id:g.id, position:it.pos, filename:f.name, master_path:paths.master,
          preview_path:paths.preview, thumb_path:paths.thumb, clean_path:paths.clean, width:dec.w, height:dec.h, bytes:f.size, sha256:it.hash,
          parent_photo_id:it.parent || null, checks:it.checks || null }).then(unwrap);
      }, 'save');
    }).then(function () {
      master = null;
      D.photos.push({ id:id, sha256:it.hash, position:it.pos, parent_photo_id:it.parent || null });
    }).catch(function (e) {
      if (e && e.skip) return;
      if (/duplicate|unique/i.test(String(e && e.message))) { it.status = 'skip'; it.msg = 'already in gallery'; return; }
      throw e;
    });
  }

  if (/[?&]debug\b/.test(location.search)) window.__ga = { render:render, decode:decode, inspect:inspect };
  boot();
})();
