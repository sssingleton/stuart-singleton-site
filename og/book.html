<title>Book a Photo Shoot in Nashville | Stuart Singleton</title>
<link rel="canonical" href="https://stuartsingleton.com/book">
<meta name="description" content="Book Stuart Singleton for band press photos ($333, was $400), portraits and headshots ($222, was $300), or live shows in Nashville. At least 12 finished images, editing included, back in seven days or less.">

<!-- Open Graph (link unfurlers: iMessage / Facebook / Slack / Pinterest) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Stuart Singleton">
<meta property="og:title" content="Book a Shoot · Stuart Singleton">
<meta property="og:description" content="Portraits, headshots and band press photos in Nashville. On sale now. At least 12 finished images, editing included, back in seven days or less. Start with a free 15-minute call.">
<!-- NOTE: og/twitter descriptions carry NO figures on purpose. This card renders IN the
     feed, directly under the post, so a printed price puts the buy/no-buy decision in
     front of someone before they have looked at the photographs. See Decision 259.
     The <meta name="description"> above is SEARCH, not feed, and keeps the numbers:
     in a search result the price is a useful qualifier and no photograph competes with it. -->
<!-- Its own card as of 2026-08-18, built by _og_build/render_book.py. It was borrowing
     og-gallery.jpg, which has "THE GALLERY" and a Paris frame baked into the pixels, so
     sharing the booking link unfurled a card announcing the gallery. Type only, no
     photograph: this card lands under a post that is already a carousel of portraits, and
     a type card needs no likeness release (Decision 241). A redesign ships as
     og-book-v2.jpg and moves these tags with it. Never overwrite a live card, because
     unfurl caches key on URL (see _og_build/README.md). -->
<meta property="og:image" content="https://stuartsingleton.com/og-book.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Book a shoot with Stuart Singleton · Portraits, headshots and band press photos · Nashville">
<meta property="og:url" content="https://stuartsingleton.com/book">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Book a Shoot · Stuart Singleton">
<meta name="twitter:description" content="Portraits, headshots and band press photos in Nashville. On sale now. At least 12 finished images, editing included, back in seven days or less.">
<meta name="twitter:image" content="https://stuartsingleton.com/og-book.jpg">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Humans who land here get sent to the live booking page. Crawlers read the tags above. -->
